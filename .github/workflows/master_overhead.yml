# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Overhead

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Install dependencies and build Next.js
        run: |
          npm ci
          npm run build

      - name: Package and verify production application
        run: |
          test -f .next/BUILD_ID
          test -f node_modules/next/dist/bin/next
          test -f node_modules/next/dist/server/require-hook.js
          node node_modules/next/dist/bin/next --version
          test -x node_modules/.bin/next
          zip -q -r deployment.zip .next node_modules public package.json package-lock.json next.config.ts \
            -x '.next/cache/*'
          unzip -Z1 deployment.zip | grep -Fx '.next/BUILD_ID'
          unzip -Z1 deployment.zip | grep -Fx 'node_modules/next/dist/bin/next'
          unzip -Z1 deployment.zip | grep -Fx 'node_modules/next/dist/server/require-hook.js'
          unzip -Z1 deployment.zip | grep -Fx 'node_modules/.bin/next'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deployment.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B4A7C9258D1348F4952660BAE3DFC3D9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_968E9FB6D10F4DA0A2483A0FF907452F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_30D988F674544F79B04BDA83AE8DC5C0 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Overhead'
          slot-name: 'Production'
          package: deployment.zip
          startup-command: 'node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port $PORT'
